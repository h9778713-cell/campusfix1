<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CampusFix</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 2.25rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--color-primary-dark); margin-bottom: 0.5rem;">Sign In to CampusFix</h1>
          <p style="font-size: 0.875rem; color: var(--color-text-muted);">Access your facilities dashboard and grievances</p>
        </div>

        <div id="alert-box" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">University Email</label>
            <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="name@campusfix.edu">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
              <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            </div>
            <div class="input-password-wrapper">
              <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
              <button type="button" id="toggle-pwd-btn" class="btn-password-toggle">Show</button>
            </div>
          </div>

          <div style="margin-top: 1.5rem;">
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">
              <span>Sign In</span>
            </button>
          </div>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--color-border); padding-top: 1.25rem;">
          <p style="font-size: 0.875rem; color: var(--color-text-muted);">
            Don't have a student account? <a href="/register.html" style="color: var(--color-primary-light); font-weight: 600; text-decoration: none;">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect away
      auth.requireGuest();
      components.renderNavbar();

      const alertBox = document.getElementById('alert-box');
      const loginForm = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');
      const pwdInput = document.getElementById('password');
      const togglePwdBtn = document.getElementById('toggle-pwd-btn');

      // Check query params for notification flags
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        showAlert('Registration successful! Please sign in with your credentials.', 'success');
      } else if (urlParams.get('session') === 'expired') {
        showAlert('Your session has expired. Please sign in again.', 'error');
      } else if (urlParams.get('loggedOut') === 'true') {
        showAlert('You have been signed out successfully.', 'info');
      }

      function showAlert(msg, type = 'error') {
        alertBox.style.display = 'block';
        alertBox.textContent = msg;
        if (type === 'error') {
          alertBox.style.backgroundColor = 'var(--status-rejected-bg)';
          alertBox.style.color = 'var(--status-rejected)';
          alertBox.style.border = '1px solid #fca5a5';
        } else if (type === 'success') {
          alertBox.style.backgroundColor = 'var(--status-resolved-bg)';
          alertBox.style.color = 'var(--status-resolved)';
          alertBox.style.border = '1px solid #86efac';
        } else {
          alertBox.style.backgroundColor = 'var(--status-progress-bg)';
          alertBox.style.color = 'var(--status-progress)';
          alertBox.style.border = '1px solid #93c5fd';
        }
      }

      // Password visibility toggle
      togglePwdBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          togglePwdBtn.textContent = 'Hide';
        } else {
          pwdInput.type = 'password';
          togglePwdBtn.textContent = 'Show';
        }
      });

      // Login submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const password = pwdInput.value;

        if (!email) {
          showAlert('University email address is required.');
          document.getElementById('email').focus();
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please enter a valid university email address.');
          document.getElementById('email').focus();
          return;
        }

        if (!password) {
          showAlert('Password is required.');
          pwdInput.focus();
          return;
        }

        components.setButtonLoading(submitBtn, true, 'Signing In...');

        try {
          const res = await api.post('/auth/login', { email, password });
          const { user, token } = res.data;

          auth.setSession(token, user);
          components.showToast('Login successful. Redirecting...', 'success');

          // Check if returnUrl was set
          const returnUrl = urlParams.get('returnUrl');
          if (returnUrl && returnUrl.startsWith('/')) {
            window.location.href = decodeURIComponent(returnUrl);
          } else if (user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/student/dashboard.html';
          }
        } catch (err) {
          components.setButtonLoading(submitBtn, false, 'Sign In');
          showAlert(api.getErrorMessage(err));
        }
      });
    });
  </script>
</body>
</html>
